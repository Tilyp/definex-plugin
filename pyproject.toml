[project]
name = "definex"
version = "0.1.0"
description = "DefineX 插件开发与编排脚手架工具"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "DefineX Team" }
]
dependencies = [
    "PyYAML>=6.0.1",
    "rich>=13.7.1",
    "click>=8.1.8",
    "mcp>=1.0.0",
    "fastmcp>=2.14.1",
    "uvicorn>=0.30.1",
    "starlette>=0.47.2",
    "sse-starlette>=2.2.1",
    "cryptography>=42.0.0",
    "watchdog>=4.0.0",
    "requests>=2.32.4",
    "typing-extensions>=4.0.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "polars>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.11.2",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
]
full = [
    "sqlalchemy>=1.4.54",
    "redis>=5.2.1",
    "pillow>=10.4.0",
    "orjson>=3.10.16",
    "pydantic>=2.11.9",
    "jsonschema>=4.23.0",
]

[project.scripts]
dfx = "definex.plugin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["definex"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=definex",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["definex"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.uv]
native-tls = true
prerelease = "if-necessary-or-explicit"
